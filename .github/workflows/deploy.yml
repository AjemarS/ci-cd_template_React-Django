name: Deploy Frontend & Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS  (Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  — Render dashboard → service → Settings → Deploy Hook
#
# REQUIRED GITHUB VARIABLES (Settings → Variables → Actions):
#   VITE_API_URL  — your Render service URL, e.g. https://my-backend.onrender.com
# ─────────────────────────────────────────────────────────────

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # JOB 1 — Build React app and deploy to GH Pages
  # ───────────────────────────────────────────────
  deploy-frontend:
    name: Build & Deploy Frontend → GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────
  # JOB 2 — Trigger Render.com deploy via webhook
  # ───────────────────────────────────────────────
  deploy-backend:
    name: Trigger Backend Deploy → Render.com
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'backend/') ||
      contains(toJSON(github.event.commits.*.added), 'backend/')

    steps:
      - name: Trigger Render deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Render deploy hook returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Render deployment triggered successfully."