      #       if [ "$STATUS" = "live" ]; then
      #         echo "✅ Deploy is live!"; exit 0
      #       elif [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ]; then
      #         echo "❌ Deploy failed with status: $STATUS"; exit 1
      #       fi
      #       sleep 30
