services:
  - type: web
    name: my-backend            # ← change to your preferred service name
    runtime: python
    region: frankfurt           # options: oregon | frankfurt | ohio | singapore
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: DJANGO_SETTINGS_MODULE
        value: core.settings

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "False"

      # Set these manually in Render dashboard (sync: false = secret):
      - key: SECRET_KEY
        sync: false             # generate one at: https://djecrety.ir

      - key: ALLOWED_HOSTS
        sync: false             # e.g.  my-backend.onrender.com

      - key: CORS_ALLOWED_ORIGINS
        sync: false             # e.g.  https://your-username.github.io